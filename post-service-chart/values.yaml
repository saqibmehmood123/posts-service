replicaCount: 1

image:
  repository: 827318513504.dkr.ecr.eu-west-2.amazonaws.com/post-service
  pullPolicy: IfNotPresent
  tag: "1.0"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  port: 8082
  type: ClusterIP

ingress:
  enabled: false

httpRoute:
  enabled: false

resources: {}

livenessProbe:
  httpGet:
    path: /actuator/health
    port: http

readinessProbe:
  httpGet:
    path: /actuator/health
    port: http


autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80


volumes: []

volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}


config:
  SPRING_PROFILES_ACTIVE: prod
  DB_HOST: mysql
  DB_PORT: "3306"


secret:
  DB_USERNAME: root
  DB_PASSWORD: root123
