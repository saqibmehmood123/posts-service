name: Deploy Posts Service

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build:
    runs-on: self-hosted

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Build Spring Boot JAR
        run: |
          mvn clean package -DskipTests


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2


      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      - name: Build Docker image
        run: |
          docker build --no-cache \
          -t posts-service:${{ github.sha }} .


      - name: Push image to ECR
        run: |
          docker tag posts-service:${{ github.sha }} \
          827318513504.dkr.ecr.eu-west-2.amazonaws.com/post-service:${{ github.sha }}

          docker push \
          827318513504.dkr.ecr.eu-west-2.amazonaws.com/post-service:${{ github.sha }}


      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
          --region eu-west-2 \
          --name saqib-eks-cluster


      - name: Deploy with Helm
        run: |
          helm upgrade --install posts-release \
          ./post-service-chart \
          -n ecommerce \
          --create-namespace \
          --set image.repository=827318513504.dkr.ecr.eu-west-2.amazonaws.com/post-service \
          --set image.tag=${{ github.sha }}


      - name: Verify deployment
        run: |
          kubectl rollout status \
          deployment/posts-release-post-service-chart \
          -n ecommerce
