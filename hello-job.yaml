apiVersion: batch/v1
kind: CronJob

metadata:
  name: hello-cronjob
  namespace: blog-app

spec:
  schedule: "*/1 * * * *"

  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: hello
            image: busybox
            command:
            - sh
            - -c
            - "echo CronJob executed at $(date)"

          restartPolicy: Never
