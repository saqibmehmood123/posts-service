apiVersion: apps/v1
kind: Deployment
metadata:
  name: posts
  namespace: myapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: posts
  template:
    metadata:
      labels:
        app: posts
      annotations:
        logging: |
          {
            "logDriver": "awslogs",
            "options": {
              "awslogs-group": "/ecs/posts-service",
              "awslogs-region": "eu-north-1",
              "awslogs-stream-prefix": "posts"
            }
          }
    spec:
      containers:
        - name: posts
          image: 617287375832.dkr.ecr.eu-north-1.amazonaws.com/posts:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://myappdb.czymmk68mp47.eu-north-1.rds.amazonaws.com:3306/myappdb?useSSL=false&serverTimezone=UTC
            - name: SPRING_DATASOURCE_USERNAME
              value: appuser
            - name: SPRING_DATASOURCE_PASSWORD
              value: mysecretpassword
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          # Optional: startup probe to ensure DB connection works before marking pod ready
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - >
                  java -cp /app/* com.example.PostsApplicationDBCheck
            failureThreshold: 3
            periodSeconds: 10

